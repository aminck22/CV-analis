  // ==========================================

  const callGeminiWithBackoff = async (payload, modelName, apiKeyToUse) => {
    const delays = [1000, 2000, 4000];
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKeyToUse}`;

    for (let attempt = 0; attempt <= delays.length; attempt++) {
      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          const status = response.status;
          // Jika model 2.5-flash tidak tersedia pada environment runtime tanpa key, fallback ke gemini-3-flash-preview
          if ((status === 404 || status === 400) && modelName === 'gemini-2.5-flash' && !apiKeyToUse) {
            const fallbackUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKeyToUse}`;
            const fallbackRes = await fetch(fallbackUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });
            if (fallbackRes.ok) {
              return await fallbackRes.json();
            }
          }
          throw new Error(errData?.error?.message || `HTTP Error ${status}`);
        }

        return await response.json();
      } catch (err) {
        if (attempt === delays.length) {
          throw err;
        }
        await new Promise((res) => setTimeout(res, delays[attempt]));
      }
    }
  };

Lakukan analisis mendalam terhadap CV kandidat berikut untuk proses rekrutmen di **PT Dimensi Jaringan Bersinar (upaznet)** - Unit Bisnis: **${targetBrandUnit}**.

### POSISI YANG DILAMAR:
**${roleTitle}**

### KRITERIA & KUALIFIKASI TEKNIS POSISI:
${jobCriteria}

### INSTRUKSI ANALISIS KHUSUS:
1. Evaluasi secara tajam apakah latar belakang pendidikan dan riwayat pengalaman kerja kandidat LINIER dengan posisi **${roleTitle}** di industri Internet Service Provider (ISP).
2. Periksa kronologi tahun bekerja/pendidikan di CV. Identifikasi apabila ada pola *job hopping* (pindah kerja di bawah 6 bulan), *employment gap* (jeda menganggur cukup lama tanpa keterangan), atau klaim keahlian yang tampak dilebih-lebihkan dibanding durasi kerjanya.
3. Buat daftar pertanyaan interview dalam 4 kategori:
   - **linearityVerification** (3-4 pertanyaan): Verifikasi pengalaman nyata kandidat dengan menyebut langsung nama perusahaan lama, jabatan, atau alat/skill yang tertulis di CV mereka.
   - **technicalCaseStudy** (3-4 pertanyaan): Studi kasus lapangan/teknis nyata sesuai posisi **${roleTitle}** di ISP upaznet (misalnya: analisa redaman tinggi di ODP, penanganan LOS massal, konfigurasi Mikrotik/OLT, strategi penetrasi sales area baru, atau penanganan pelanggan komplain di jam sibuk).
   - **redFlagConfirmation** (3 pertanyaan): Pertanyaan tajam namun tetap profesional dan sopan untuk mengonfirmasi kekurangan skill, alasan pindah kerja cepat, atau jeda karir pada CV kandidat.
   - **attitudeAndMental** (3 pertanyaan): Menguji integritas, kejujuran, kesiapan kerja tim/shift/lapangan, serta loyalitas kerja.
4. Setiap pertanyaan wajib dilengkapi dengan **idealAnswerIndicator** yang konkret sebagai panduan penilaian HR/User Interviewer.
      `.trim();

      const parts = [{ text: promptText }];

      if (inputMode === 'file' && uploadedFile) {
        parts.push({
          inlineData: {
            mimeType: uploadedFile.mimeType,
            data: uploadedFile.base64
          }
        });
      } else {
        parts.push({
          text: `\n\n=== ISI TEKS CV KANDIDAT ===\n${cvText}`
        });
      }

      const payload = {
        contents: [{ role: 'user', parts }],
        systemInstruction: {
          parts: [{ text: SYSTEM_INSTRUCTION }]
        },
        generationConfig: {
          responseMimeType: 'application/json',
          responseSchema: RESPONSE_SCHEMA,
          temperature: 0.25
        }
      };

      const apiKey = userApiKey.trim() || "";
      const result = await callGeminiWithBackoff(payload, selectedModel, apiKey);

      const rawJsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!rawJsonText) {
        throw new Error('Respons dari Gemini AI kosong atau tidak valid.');
      }

      const parsedData = JSON.parse(rawJsonText);
      setAnalysisResult(parsedData);

      // Inisialisasi state penilaian interview untuk tiap pertanyaan
      const initialEval = {};
      const categories = [
        'linearityVerification',
        'technicalCaseStudy',
        'redFlagConfirmation',
        'attitudeAndMental'
      ];
      categories.forEach((cat) => {
        const list = parsedData.interviewQuestions?.[cat] || [];
        list.forEach((_, idx) => {
          initialEval[`${cat}_${idx}`] = {
            checked: false,
            score: 0,
            note: ''
          };
        });
      });
      setInterviewEval(initialEval);
      setActiveInterviewTab('linearityVerification');

      setTimeout(() => {
        resultSectionRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, 150);
    } catch (err) {
      console.error('Analysis Error:', err);
      setErrorMsg(
        `Gagal menganalisis CV: ${err.message || 'Terjadi kesalahan koneksi ke Gemini API. Pastikan API Key valid atau file tidak rusak.'}`

  };

                  </div>
                  <div>
                    <h3 className="text-sm font-bold text-[#10B981]">
                      Nilai Plus (Strengths)
                    </h3>
                    <p className="text-[11px] text-slate-400 print-text-muted">
                      Keunggulan, skill relevan & pencapaian
                    </p>
                  </div>
                </div>

                <ul className="space-y-2.5 flex-1">
                  {(analysisResult.strengths || []).map((item, idx) => (
                    <li key={idx} className="flex items-start gap-2.5 text-xs sm:text-sm text-slate-200 print-text-dark">
                      <span className="w-5 h-5 rounded-full bg-[#10B981]/20 text-[#10B981] flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">
                        +
                      </span>
                      <span className="leading-relaxed">{item}</span>
                    </li>
                  ))}
                </ul>
              </div>

              {/* Kolom 2: Nilai Minus (Gaps/Weaknesses) - Amber (#F59E0B) */}
              <div className="bg-[#111C38] border border-[#F59E0B]/30 rounded-2xl p-5 shadow-lg flex flex-col print-card">
                <div className="flex items-center gap-2.5 pb-3.5 mb-4 border-b border-slate-800">
                  <div className="w-9 h-9 rounded-xl bg-[#F59E0B]/15 text-[#F59E0B] flex items-center justify-center flex-shrink-0">
                    <AlertTriangle className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-sm font-bold text-[#F59E0B]">
                      Nilai Minus (Gaps / Weaknesses)
                    </h3>
                    <p className="text-[11px] text-slate-400 print-text-muted">
                      Gap kompetensi teknis / butuh training
                    </p>
                  </div>
                </div>

                <ul className="space-y-2.5 flex-1">
                  {(analysisResult.weaknesses || []).map((item, idx) => (
                    <li key={idx} className="flex items-start gap-2.5 text-xs sm:text-sm text-slate-200 print-text-dark">
                      <span className="w-5 h-5 rounded-full bg-[#F59E0B]/20 text-[#F59E0B] flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">
                        -
                      </span>
                      <span className="leading-relaxed">{item}</span>
                    </li>
                  ))}
                </ul>
              </div>

              {/* Kolom 3: Indikasi / Red Flags - Coral Red (#EF4444) */}
              <div className="bg-[#111C38] border border-[#EF4444]/30 rounded-2xl p-5 shadow-lg flex flex-col print-card">
                <div className="flex items-center gap-2.5 pb-3.5 mb-4 border-b border-slate-800">
                  <div className="w-9 h-9 rounded-xl bg-[#EF4444]/15 text-[#EF4444] flex items-center justify-center flex-shrink-0">
                    <ShieldAlert className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-sm font-bold text-[#EF4444]">
                      Indikasi / Red Flags
                    </h3>
                    <p className="text-[11px] text-slate-400 print-text-muted">
                      Job hopping, gap tahun kosong, inkonsistensi
                    </p>
                  </div>
                </div>

                <ul className="space-y-2.5 flex-1">
                  {(analysisResult.redFlags || []).length > 0 ? (
                    analysisResult.redFlags.map((item, idx) => (
                      <li key={idx} className="flex items-start gap-2.5 text-xs sm:text-sm text-slate-200 print-text-dark">
                        <span className="w-5 h-5 rounded-full bg-[#EF4444]/20 text-[#EF4444] flex items-center justify-center text-xs font-bold flex-shrink-0 mt-0.5">
                          !
                        </span>
                        <span className="leading-relaxed">{item}</span>
                      </li>
                    ))
                  ) : (
                    <li className="text-xs text-slate-400 italic">
                      Tidak ditemukan indikasi red flag mayor pada CV.
                    </li>
                  )}
                </ul>
              </div>

            </div>

            {/* ==========================================
                C. GENERATOR PERTANYAAN INTERVIEW OTOMATIS & PENILAIAN HR
            ========================================== */}
            <div className="bg-[#111C38] border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl space-y-6 print-card">
              
              {/* Header Seksi Interview */}
              <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-[#00A8E8]/15 border border-[#00A8E8]/30 flex items-center justify-center text-[#00A8E8]">
                    <MessageSquare className="w-5 h-5" />
                  </div>
                  <div>
                    <h3 className="text-lg font-bold text-white print-text-dark">
                      Panduan Wawancara Kandidat & Lembar Skor HR
                    </h3>
                    <p className="text-xs text-slate-400 print-text-muted">
                      Pertanyaan disusun spesifik berdasarkan isi CV <strong>{analysisResult.candidateName}</strong> beserta indikator jawaban ideal
                    </p>
                  </div>
                </div>

                {/* Live Skor Wawancara Summary */}
                <div className="flex flex-wrap items-center gap-3 bg-[#0B132B] border border-slate-800 rounded-xl px-4 py-2.5 print-card">
                  <div className="text-xs">
                    <span className="text-slate-400 print-text-muted">Pertanyaan Ditanyakan: </span>
                    <strong className="text-white print-text-dark">
                      {interviewStats.checkedCount} / {interviewStats.totalQuestions}
                    </strong>
                  </div>
                  <span className="text-slate-700">|</span>
                  <div className="flex items-center gap-1.5 text-xs">
                    <Star className="w-4 h-4 text-[#F59E0B] fill-[#F59E0B]" />
                    <span className="text-slate-400 print-text-muted">Rata-rata Skor Interview: </span>
                    <strong className="text-[#00A8E8] text-sm">
                      {interviewStats.avgScore} / 5.0
                    </strong>
                  </div>
                </div>
              </div>

              {/* Navigasi 4 Tab Kategori Pertanyaan (No-Print) */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5 no-print">
                {INTERVIEW_TABS.map((tab) => {
                  const IconComp = tab.icon;
                  const isActive = activeInterviewTab === tab.id;
                  const questionsInTab = analysisResult.interviewQuestions?.[tab.id] || [];
                  const answeredInTab = questionsInTab.filter(
                    (_, idx) => interviewEval[`${tab.id}_${idx}`]?.checked
                  ).length;

                  return (
                    <button
                      key={tab.id}
                      type="button"
                      onClick={() => setActiveInterviewTab(tab.id)}
                      className={`p-3.5 rounded-xl border text-left transition cursor-pointer flex flex-col justify-between gap-2 ${
                        isActive
                          ? 'bg-[#00A8E8]/15 border-[#00A8E8] text-white shadow-md'
                          : 'bg-[#0B132B]/80 border-slate-800 text-slate-400 hover:border-slate-700 hover:text-slate-200'
                      }`}
                    >
                      <div className="flex items-center justify-between">
                        <IconComp className={`w-4 h-4 ${isActive ? 'text-[#00A8E8]' : 'text-slate-500'}`} />
                        <span className="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">
                          {answeredInTab}/{questionsInTab.length}
                        </span>
                      </div>
                      <p className="text-xs font-bold leading-snug">{tab.label}</p>
                    </button>
                  );
                })}
              </div>

              {/* Daftar Pertanyaan pada Tab Aktif (Interaktif di Layar) */}
              <div className="space-y-4 no-print">
                {INTERVIEW_TABS.filter((t) => t.id === activeInterviewTab).map((activeTabObj) => {
                  const list = analysisResult.interviewQuestions?.[activeTabObj.id] || [];
                  return (
                    <div key={activeTabObj.id} className="space-y-4">
                      <div className="bg-[#0B132B]/60 border border-slate-800/80 rounded-xl px-4 py-2.5 flex items-center justify-between">
                        <span className="text-xs text-slate-300">{activeTabObj.desc}</span>
                      </div>

                      {list.map((qItem, idx) => {
                        const evalKey = `${activeTabObj.id}_${idx}`;
                        const currentEval = interviewEval[evalKey] || {
                          checked: false,
                          score: 0,
                          note: ''
                        };

                        return (
                          <div
                            key={evalKey}
                            className={`rounded-2xl border p-5 transition ${
                              currentEval.checked
                                ? 'bg-[#0B132B] border-[#10B981]/50'
                                : 'bg-[#0B132B]/90 border-slate-800'
                            }`}
                          >
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
                              
                              {/* Kiri (7 Kolom): Pertanyaan & Indikator Jawaban Ideal */}
                              <div className="lg:col-span-7 space-y-3">
                                <div className="flex items-start gap-3">
                                  <button
                                    type="button"
                                    onClick={() =>
                                      updateQuestionEval(evalKey, 'checked', !currentEval.checked)
                                    }
                                    className={`mt-0.5 w-6 h-6 rounded-lg border flex items-center justify-center flex-shrink-0 transition cursor-pointer ${
                                      currentEval.checked
                                        ? 'bg-[#10B981] border-[#10B981] text-slate-950'
                                        : 'bg-slate-900 border-slate-600 text-transparent hover:border-[#00A8E8]'
                                    }`}
                                    title="Tandai sudah ditanyakan"
                                  >
                                    <Check className="w-4 h-4 stroke-[3]" />
                                  </button>
                                  <div>
                                    <span className="text-[11px] font-bold uppercase tracking-wider text-[#00A8E8]">
                                      Pertanyaan #{idx + 1}
                                    </span>
                                    <h4 className="text-sm sm:text-base font-bold text-white leading-snug mt-0.5">
                                      “{qItem.question}”
                                    </h4>
                                  </div>
                                </div>

                                {/* Box Indikator Jawaban Ideal */}
                                <div className="ml-9 bg-[#111C38] border border-slate-800 rounded-xl p-3.5 space-y-1">
                                  <div className="flex items-center gap-1.5 text-xs font-bold text-[#10B981]">
                                    <CheckCircle2 className="w-3.5 h-3.5" />
                                    <span>Indikator Jawaban Ideal:</span>
                                  </div>
                                  <p className="text-xs text-slate-300 leading-relaxed">
                                    {qItem.idealAnswerIndicator}
                                  </p>
                                </div>
                              </div>

                              {/* Kanan (5 Kolom): Skor 1-5 & Catatan Singkat HR */}
                              <div className="lg:col-span-5 bg-[#111C38]/90 border border-slate-800 rounded-xl p-4 flex flex-col justify-between space-y-3">
                                <div>
                                  <div className="flex items-center justify-between mb-2">
                                    <span className="text-xs font-semibold text-slate-300">
                                      Skor Jawaban Kandidat (1 - 5):
                                    </span>
                                    {currentEval.score > 0 && (
                                      <span className="text-xs font-bold text-[#00A8E8]">
                                        Skor: {currentEval.score}/5
                                      </span>
                                    )}
                                  </div>

                                  {/* Tombol Skor 1 - 5 */}
                                  <div className="grid grid-cols-5 gap-1.5">
                                    {[1, 2, 3, 4, 5].map((num) => (
                                      <button
                                        key={num}
                                        type="button"
                                        onClick={() => {
                                          updateQuestionEval(evalKey, 'score', num);
                                          if (!currentEval.checked) {
                                            updateQuestionEval(evalKey, 'checked', true);
                                          }
                                        }}
                                        className={`py-1.5 rounded-lg text-xs font-bold border transition cursor-pointer ${
                                          currentEval.score === num
                                            ? 'bg-[#00A8E8] border-[#00A8E8] text-white shadow'
                                            : 'bg-[#0B132B] border-slate-700 text-slate-400 hover:border-slate-500 hover:text-white'
                                        }`}
                                      >
                                        {num} ★
                                      </button>
                                    ))}
                                  </div>
                                </div>

                                <div>
                                  <label className="block text-xs font-semibold text-slate-300 mb-1">
                                    Catatan Jawaban / Observasi Interviewer:
                                  </label>
                                  <textarea
                                    rows={2}
                                    value={currentEval.note}
                                    onChange={(e) =>
                                      updateQuestionEval(evalKey, 'note', e.target.value)
                                    }
                                    placeholder="Ketik poin jawaban kandidat atau catatan verifikasi..."
                                    className="w-full bg-[#0B132B] border border-slate-700 focus:border-[#00A8E8] rounded-lg p-2.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none resize-none"
                                  />
                                </div>
                              </div>

                            </div>
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>

              {/* TAMPILAN LENGKAP SEMUA KATEGORI PERTANYAAN KHUSUS SAAT DICETAK / PDF */}
              <div className="hidden print-only space-y-6">
                {INTERVIEW_TABS.map((tabObj) => {
                  const list = analysisResult.interviewQuestions?.[tabObj.id] || [];
                  return (
                    <div key={tabObj.id} className="space-y-3 border-t border-slate-300 pt-4">
                      <h4 className="text-sm font-bold uppercase text-slate-900">
                        {tabObj.label}
                      </h4>
                      {list.map((qItem, idx) => {
                        const evalKey = `${tabObj.id}_${idx}`;
                        const currentEval = interviewEval[evalKey] || {
                          checked: false,
                          score: 0,
                          note: ''
                        };
                        return (
                          <div key={evalKey} className="border border-slate-300 rounded-lg p-3 space-y-1.5 break-inside-avoid">
                            <div className="flex items-center justify-between">
                              <span className="text-xs font-bold text-slate-900">
                                [{currentEval.checked ? '✓ Ditanyakan' : 'Belum Ditanyakan'}] Pertanyaan #{idx + 1}
                              </span>
                              <span className="text-xs font-bold text-slate-800">
                                Skor Interview: {currentEval.score > 0 ? `${currentEval.score} / 5` : '- / 5'}
                              </span>
                            </div>
                            <p className="text-xs font-semibold text-slate-900">
                              “{qItem.question}”
                            </p>
                            <p className="text-[11px] text-slate-600">
                              <strong>Indikator Ideal:</strong> {qItem.idealAnswerIndicator}
                            </p>
                            <p className="text-[11px] text-slate-800 bg-slate-100 p-2 rounded">
                              <strong>Catatan Pewawancara:</strong> {currentEval.note || '(Tidak ada catatan tertulis)'}
                            </p>
                          </div>
                        );
                      })}
                    </div>
                  );
                })}
              </div>

            </div>

            {/* ==========================================
                D. KESIMPULAN AKHIR HR & TOMBOL EXPORT LAPORAN PDF
            ========================================== */}
            <div className="bg-[#111C38] border border-slate-800 rounded-2xl p-5 sm:p-6 shadow-xl space-y-5 print-card">
              <div className="flex items-center gap-2.5 border-b border-slate-800 pb-3.5">
                <ClipboardCheck className="w-5 h-5 text-[#00A8E8]" />
                <h3 className="text-base font-bold text-white print-text-dark">
                  Keputusan Akhir & Catatan HR PT Dimensi Jaringan Bersinar
                </h3>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5 print-text-dark">
                    Nama Pewawancara (HR / User Teknis):
                  </label>
                  <input
                    type="text"
                    value={interviewerName}
                    onChange={(e) => handleInterviewerChange(e.target.value)}
                    placeholder="Contoh: Bpk. Hendra (HRD) / Lead NOC"
                    className="w-full bg-[#0B132B] border border-slate-700 focus:border-[#00A8E8] rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none print-card print-text-dark"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-300 mb-1.5 print-text-dark">
                    Status Rekomendasi Interview:
                  </label>
                  <select
                    value={interviewRecommendation}
                    onChange={(e) => setInterviewRecommendation(e.target.value)}
                    className="w-full bg-[#0B132B] border border-slate-700 focus:border-[#00A8E8] rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white font-semibold focus:outline-none print-card print-text-dark"
                  >
                    <option value="Direkomendasikan Lanjut / Hire">✅ Direkomendasikan Lanjut / Hire</option>
                    <option value="Lanjut Uji Praktik Lapangan / Splicing / Mikrotik">🛠️ Lanjut Uji Praktik Lapangan / Teknis</option>
                    <option value="Dipertimbangkan (Cadangan)">⚠️ Dipertimbangkan (Kandidat Cadangan)</option>
                    <option value="Belum Sesuai / Ditolak">❌ Belum Sesuai / Tidak Lanjut</option>
                  </select>
                </div>

                <div className="bg-[#0B132B] border border-slate-800 rounded-xl p-3 flex flex-col justify-center print-card">
                  <span className="text-[11px] text-slate-400 print-text-muted">Rekapitulasi Skor Akhir:</span>
                  <div className="flex items-center justify-between mt-1">
                    <span className="text-xs font-bold text-slate-200 print-text-dark">
                      CV Match: <strong className="text-[#00A8E8]">{analysisResult.matchScore}%</strong>
                    </span>
                    <span className="text-xs font-bold text-slate-200 print-text-dark">
                      Skor Interview: <strong className="text-[#10B981]">{interviewStats.avgScore} / 5.0</strong>
                    </span>
                  </div>
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-300 mb-1.5 print-text-dark">
                  Catatan Kesimpulan HR / Hasil Praktik / Ekspektasi Gaji & Kesiapan Mulai Kerja:
                </label>
                <textarea
                  rows={3}
                  value={hrSummaryNotes}
                  onChange={(e) => setHrSummaryNotes(e.target.value)}
                  placeholder="Tuliskan rangkuman hasil wawancara, ketersediaan mulai kerja, ekspektasi gaji, serta kesiapan ditempatkan di unit upaznet / METARA..."
                  className="w-full bg-[#0B132B] border border-slate-700 focus:border-[#00A8E8] rounded-xl p-3.5 text-xs sm:text-sm text-slate-200 placeholder-slate-500 focus:outline-none print-card print-text-dark"
                />
              </div>

              <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pt-3 border-t border-slate-800 no-print">
                <p className="text-xs text-slate-400">
                  Dokumen ini siap dicetak atau disimpan sebagai PDF untuk arsip rekrutmen <strong>PT Dimensi Jaringan Bersinar</strong>.
                </p>
                <button
                  type="button"
                  onClick={handlePrintReport}
                  className="w-full sm:w-auto inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl text-xs sm:text-sm font-bold bg-gradient-to-r from-[#00A8E8] to-[#10B981] hover:opacity-95 text-slate-950 shadow-lg transition cursor-pointer"
                >
                  <Printer className="w-4 h-4" />
                  <span>Cetak / Simpan PDF Hasil Screening & Interview</span>
                </button>
              </div>
            </div>

          </div>
        )}
      </main>

      {/* ==========================================
          FOOTER
      ========================================== */}
      <footer className="border-t border-slate-800/80 mt-12 py-6 text-center text-xs text-slate-500 no-print">
        <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
          <p>
            © {new Date().getFullYear()} <strong className="text-slate-300">PT Dimensi Jaringan Bersinar</strong> — Brand Utama: <strong className="text-[#00A8E8]">upaznet</strong> & Sub-unit Ekspansi: <strong className="text-slate-300">METARA</strong>
          </p>
          <p>Upaznet Talent Radar v1.0 • HR Intelligence & Candidate Screening Portal</p>
        </div>
      </footer>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
